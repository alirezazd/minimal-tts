[package]
name = "minimal-tts"
version = "0.1.4"
edition = "2021"

[dependencies]
anyhow = "1"
i-slint-core = { version = "=1.17.1", features = ["shared-parley"] }
cpal = "0.16"
dirs = "6"
fancy-regex = "0.14"
hound = "3.5"
libloading = "0.8"
ort = { version = "2.0.0-rc.10", features = ["download-binaries"] }
serde_json = "1"
# fontique: register the bundled font in memory; raw-window-handle: the HWND
# Windows media controls attach to
slint = { version = "1.17", features = ["renderer-skia", "unstable-fontique-010", "raw-window-handle-06"] }
souvlaki = { version = "0.8", default-features = false, features = ["use_zbus"] }
unicode-segmentation = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"

[build-dependencies]
slint-build = "1.17"

# the .exe's icon (rendered from the SVG) and its application manifest
[target.'cfg(windows)'.build-dependencies]
ico = "0.4"
resvg = "0.47"
winresource = "0.1"

[profile.release]
strip = true
lto = "thin"

# keep the UI responsive in dev builds — the renderer is unusable at opt 0
[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

# headless MainWindow for the editor-mechanism tests (not in the shipped binary)
[dev-dependencies]
i-slint-backend-testing = "=1.17.1"
