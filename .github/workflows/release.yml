name: Release

# Tag a commit and the AppImage builds and publishes itself:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  appimage:
    # The prebuilt ONNX Runtime that `ort` downloads references __isoc23_*
    # symbols, which only exist in glibc 2.38+. That sets the floor, not the
    # runner: on 22.04 (glibc 2.35) the link fails outright, and no older
    # runner can produce a more portable binary. 24.04 ships 2.39.
    runs-on: ubuntu-24.04
    env:
      # Libraries every desktop Linux already has, so they must come from the
      # host: AppRun puts vendor/ on the search path, and a bundled libstdc++
      # older than the one the host's graphics stack expects crashes the app.
      # Anything espeak-ng needs that is NOT on this list has to travel inside
      # the AppImage — libsonic is the one that bit us, absent on Fedora.
      # Matched with grep -E, not a case pattern: a variable holding "a|b"
      # expands to one literal pattern in `case`, so nothing would be excluded.
      HOST_LIBS: '^(libc|libm|libpthread|libdl|librt|libstdc\+\+|libgcc_s)\.so\.|^ld-linux'
    steps:
      - uses: actions/checkout@v4

      - name: Install build and packaging deps
        # The 24.04 runner image ships far fewer -dev packages than 22.04, so
        # every *-sys crate's system library has to be named explicitly.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libfontconfig1-dev \
            libssl-dev \
            espeak-ng \
            zsync
          # libasound2-dev     cpal
          # libfontconfig1-dev slint -> fontique -> yeslogic-fontconfig-sys
          # libssl-dev         ort-sys's build script fetches ONNX Runtime over TLS
          # espeak-ng          vendored into the AppImage below
          # zsync              appimagetool shells out to zsyncmake for the update file

      - name: Cache cargo and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-

      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: models
          key: models-${{ hashFiles('scripts/get-models.sh') }}

      - name: Fetch model and voices
        run: ./scripts/get-models.sh

      - name: Vendor espeak-ng
        # The lib and its data travel inside the AppImage so it runs with no
        # system espeak-ng installed. Locate both rather than hardcoding paths:
        # Debian/Ubuntu keep the data under /usr/lib/<triplet>, Fedora under
        # /usr/share.
        run: |
          mkdir -p vendor
          lib=$(ldconfig -p | awk '/libespeak-ng\.so\.1/ {print $NF; exit}')
          data=$(find /usr/lib /usr/share -maxdepth 3 -type d -name espeak-ng-data -print -quit)
          test -n "$lib"  || { echo "libespeak-ng.so.1 not found" >&2; exit 1; }
          test -n "$data" || { echo "espeak-ng-data not found" >&2; exit 1; }
          echo "lib=$lib data=$data"
          cp "$lib" vendor/libespeak-ng.so
          cp -r "$data" vendor/
          # espeak-ng has auxiliary libraries of its own — Ubuntu links libsonic
          # and libpcaudio. A missing one makes the dlopen fail, so the app
          # exits before showing a window. Take espeak-ng's *direct* NEEDED
          # entries: the full ldd closure would pull libasound/libpulse in too,
          # and those belong to the host.
          for so in $(readelf -d "$lib" | sed -n 's/.*NEEDED.*\[\(.*\)\]/\1/p'); do
            if echo "$so" | grep -qE "$HOST_LIBS"; then continue; fi
            path=$(ldd "$lib" | awk -v s="$so" '$1 == s {print $3; exit}')
            test -n "$path" || { echo "$so did not resolve" >&2; exit 1; }
            cp -L "$path" "vendor/$so"
            echo "vendored $so <- $path"
          done

      - name: Build AppImage
        env:
          VERSION: ${{ github.ref_name }}
        run: ./scripts/build-appimage.sh

      - name: Verify the bundle is self-contained
        # The runner has espeak-ng's dependencies installed system-wide, so
        # merely running the AppImage here proves nothing about other distros.
        # Assert instead that every library espeak-ng needs is physically in the
        # bundle — that is the check that would have caught shipping a build
        # which died on any host without libsonic.
        run: |
          ./dist/Minimal_TTS-*-x86_64.AppImage --appimage-extract >/dev/null
          v=squashfs-root/usr/bin/vendor
          for so in $(readelf -d "$v/libespeak-ng.so" | sed -n 's/.*NEEDED.*\[\(.*\)\]/\1/p'); do
            if echo "$so" | grep -qE "$HOST_LIBS"; then continue; fi
            test -f "$v/$so" || { echo "not bundled: $so" >&2; exit 1; }
            echo "bundled: $so"
          done
          printf 'Bundle check.' | ./squashfs-root/AppRun - -o /tmp/check.wav
          test -s /tmp/check.wav
          rm -rf squashfs-root

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # The .zsync must ship alongside the AppImage — Gear Lever and
          # AppImageUpdate resolve it from the release assets to self-update.
          #
          # Idempotent: `gh release create` errors if the release exists, which
          # would make any re-run or moved tag fail at the very last step.
          # Create it only when missing, then upload with --clobber so a rebuild
          # replaces the assets instead of colliding with them.
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" \
            dist/Minimal_TTS-*-x86_64.AppImage \
            dist/Minimal_TTS-*-x86_64.AppImage.zsync \
            --clobber
